<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: M; font-weight: 800; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2); }
@font-face { font-family: M; font-weight: 900; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1020; font-family: M, sans-serif; }
#c { position: absolute; inset: 0; }
.ui { position: absolute; inset: 0; pointer-events: none; }
#brand { position: absolute; left: 60px; top: 70px; font-weight: 900; font-size: 46px; color: #fff; letter-spacing: 2px;
  text-shadow: 0 3px 10px rgba(0,0,0,.5); }
#brand b { color: #ff9a1f; }
#ring { position: absolute; right: 50px; top: 40px; width: 110px; height: 110px; }
#pill { position: absolute; top: 175px; left: 50%; transform: translateX(-50%); background: rgba(12,16,28,.82);
  border: 2px solid rgba(255,255,255,.15); border-radius: 60px; padding: 16px 40px 16px 18px; display: flex; align-items: center;
  gap: 18px; color: #fff; font-weight: 800; font-size: 50px; white-space: nowrap; transition: none; }
#pill .n { background: #ff9a1f; color: #111; border-radius: 50%; width: 66px; height: 66px; display: flex; align-items: center;
  justify-content: center; font-size: 34px; font-weight: 900; }
#stat { position: absolute; top: 330px; width: 100%; text-align: center; color: #ffc83a; font-weight: 900; font-size: 150px;
  text-shadow: 0 6px 24px rgba(0,0,0,.6); line-height: 1; }
#statsub { position: absolute; top: 490px; width: 100%; text-align: center; color: #fff; font-weight: 800; font-size: 50px;
  letter-spacing: 3px; text-shadow: 0 4px 14px rgba(0,0,0,.7); }
#cap { position: absolute; top: 1330px; left: 60px; right: 60px; text-align: center; font-weight: 900; font-size: 92px; line-height: 1.08;
  color: #fff; text-transform: uppercase; -webkit-text-stroke: 7px #000; paint-order: stroke fill;
  text-shadow: 0 8px 18px rgba(0,0,0,.45); }
#cap .k { color: #ffc83a; }
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="ui">
  <div id="brand">INSIDE <b>60</b></div>
  <svg id="ring" viewBox="0 0 110 110"><circle cx="55" cy="55" r="44" fill="rgba(12,16,28,.82)"/>
    <circle cx="55" cy="55" r="44" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/>
    <circle id="arc" cx="55" cy="55" r="44" fill="none" stroke="#ff9a1f" stroke-width="7" stroke-linecap="round"
      transform="rotate(-90 55 55)" stroke-dasharray="276.5" stroke-dashoffset="0"/>
    <text id="sec" x="55" y="66" text-anchor="middle" fill="#fff" font-family="M" font-weight="900" font-size="32">60</text></svg>
  <div id="pill"><div class="n" id="pn">01</div><div id="pl">LABEL</div></div>
  <div id="stat"></div><div id="statsub"></div>
  <div id="cap"></div>
</div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
const TL = await (await fetch('__TIMELINE__')).json();
const mod = await import('__SCENE__');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920, false);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1080 / 1920, 0.1, 500);
const api = await mod.setup({ THREE, scene, camera, renderer });
const $ = id => document.getElementById(id);
const total = TL.total;
function captionAt(t) {
  // groups of up to 3 words; keywords (marked *word* in script) highlighted
  for (const g of TL.groups) if (t >= g.s && t < g.e) return g.html;
  return '';
}
window.renderAt = (t) => {
  let si = 0;
  for (let i = 0; i < TL.steps.length; i++) if (t >= TL.steps[i].s) si = i;
  const st = TL.steps[si];
  const lt = t - st.s;
  api.update(t, si, lt, st.e - st.s);
  renderer.render(scene, camera);
  $('pn').textContent = String(si + 1).padStart(2, '0');
  $('pl').textContent = st.label.toUpperCase();
  $('pill').style.opacity = st.label ? 1 : 0;
  const pop = Math.min(1, lt / 0.25);
  $('pill').style.transform = `translateX(-50%) scale(${0.85 + 0.15 * pop})`;
  $('stat').textContent = st.stat || ''; $('statsub').textContent = st.statsub || '';
  const sp = Math.min(1, lt / 0.3);
  $('stat').style.transform = `scale(${0.6 + 0.4 * sp})`; $('stat').style.opacity = sp; $('statsub').style.opacity = sp;
  const left = Math.max(0, total - t);
  $('sec').textContent = Math.ceil(left);
  $('arc').setAttribute('stroke-dashoffset', (276.5 * (1 - left / total)).toFixed(1));
  $('cap').innerHTML = captionAt(t);
  return true;
};
await document.fonts.ready;
window.READY = true;
</script>
</body></html>
